name: Dry run — NDIA Accountability Project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out template
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install -r scraper/requirements.draft-2.txt
      - name: Select NDIA Accountability configuration
        run: cp WATCH_CONFIG.ndiaaccountability.draft-1.py WATCH_CONFIG.py
      - name: Run read-only archive dry run
        run: python scraper/main.draft-2.py
      - name: Upload dry-run archive for review
        uses: actions/upload-artifact@v4
        with:
          name: ndia-accountability-dry-run
          path: archive/ndia-accountability/
          if-no-files-found: error
          retention-days: 7
