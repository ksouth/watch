name: Publish NDIA Accountability archive (recursive draft 3)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install -r scraper/requirements.draft-2.txt
      - name: Select NDIA Accountability configuration
        run: cp WATCH_CONFIG.ndiaaccountability.draft-1.py WATCH_CONFIG.py
      - name: Recursively capture archive
        run: python scraper/main.draft-4.py
      - name: Build Pages site
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NDIA Accountability Archive</title></head>
          <body><main><h1>NDIA Accountability Archive</h1><p>Recursive public-source capture.</p><p><a href="archive/ndia-accountability/">Open the archive</a></p></main></body></html>
          HTML
          cp -R archive site/archive
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
