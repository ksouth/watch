name: Watch archive (draft 2)

on:
  workflow_dispatch:
  push:
    paths:
      - "WATCH_CONFIG.py"
      - "scraper/**"
      - ".github/workflows/watch-archive.draft-2.yml"
  schedule:
    - cron: "17 3 * * *"
      timezone: "Australia/Melbourne"

permissions:
  contents: write

concurrency:
  group: watch-archive-writers
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r scraper/requirements.draft-2.txt
      - name: Run configured archive
        run: python scraper/main.draft-2.py
      - name: Commit archive changes
        run: |
          git add archive
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Watch Archive Bot"
          git config user.email "watch-archive-bot@users.noreply.github.com"
          git commit -m "Update configured watch archive"
          git push
