name: Map NDIA Accountability coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r scraper/requirements.draft-2.txt
      - name: Build route and pagination coverage report
        run: python scraper/coverage_ndia.draft-1.py
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ndia-accountability-coverage
          path: archive/ndia-accountability/coverage/
          retention-days: 7
